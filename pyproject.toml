[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "westquant-core"
version = "0.2.0a1"
description = "Core representation contracts, WQIR and RepGraph for WestQuant Open"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [{name = "WestQuant Open / David Vesterlund"}]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
